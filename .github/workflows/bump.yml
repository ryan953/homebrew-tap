name: Bump

# The single place that knows how to move a formula or a cask to a new version.
#
# Run it by hand from this repository (Actions -> Bump -> Run workflow), or let
# a source repository call it on `release: published`, so the tap follows every
# release without anyone remembering to bump it. Keeping the logic here rather
# than copied into each project is what stops the three projects from drifting
# apart.

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Formula (a command-line program) or cask (a macOS app)
        required: true
        type: choice
        options: [formula, cask]
      name:
        description: Formula or cask name, without the .rb suffix
        required: true
        type: string
      version:
        description: New version, with or without a leading v
        required: true
        type: string

  workflow_call:
    inputs:
      kind:
        required: true
        type: string
      name:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      TAP_TOKEN:
        # Required in practice for a caller, because the caller's own
        # github.token cannot push here. Declared optional so the job can fail
        # with an explanation instead of a secret-not-found error.
        required: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A reusable workflow checks out the CALLER's repository by default, so
      # the tap has to be named explicitly. The token has to be able to push
      # here; a caller's github.token cannot, which is what TAP_TOKEN is for.
      - name: Guard the token
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ "${{ github.repository }}" != "ryan953/homebrew-tap" ] && [ -z "${TAP_TOKEN}" ]; then
            echo "::error::TAP_TOKEN is not set in ${{ github.repository }}."
            echo "Add a token with Contents: Read+Write on ryan953/homebrew-tap"
            echo "and Contents: Read on this repository, then re-run."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          repository: ryan953/homebrew-tap
          ref: main
          token: ${{ secrets.TAP_TOKEN || github.token }}

      # bump-cask.sh reads the release through the API, which needs a token that
      # can see the source repository. bump-formula.sh downloads public release
      # URLs and needs none, but passing it does no harm.
      - name: Bump ${{ inputs.name }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.TAP_TOKEN || github.token }}
          KIND: ${{ inputs.kind }}
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$KIND" in
            formula) scripts/bump-formula.sh "$NAME" "$VERSION" ;;
            cask)    scripts/bump-cask.sh    "$NAME" "$VERSION" ;;
            *) echo "::error::kind must be formula or cask, got '$KIND'"; exit 1 ;;
          esac

      # Re-running a release, or a bump to the version already recorded, leaves
      # the file untouched. That is a success, not something to fail the job on.
      - name: Commit
        env:
          NAME: ${{ inputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "${NAME} is already at ${VERSION#v}; nothing to commit." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "${NAME} ${VERSION#v}"
          git push
          echo "Bumped ryan953/tap/${NAME} to ${VERSION#v}" >> "$GITHUB_STEP_SUMMARY"
