name: Sync

# Pulls new versions in rather than waiting to be pushed one. Every source is a
# public repository, so this needs no credentials and covers formulae and casks
# alike; it is also the safety net for a push that never arrived, which is how
# a cask can otherwise sit at an old version after a release.

on:
  # Hourly rather than daily: this is the only path a new version takes into
  # the tap, so the interval is how long `brew upgrade` keeps handing out the
  # old one after a release.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Bump anything that is behind
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/sync.sh

      - name: Commit
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Everything is up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "sync with the latest releases"
          git push
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
