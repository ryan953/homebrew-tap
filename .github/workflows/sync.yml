name: Sync formulae

# Pulls new versions in rather than waiting to be pushed one, so a formula in a
# work org needs no token for this tap and no reference to it. Only works
# because a public release is readable without credentials, which is why the
# private casks push instead.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Bump anything that is behind
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/sync-formulae.sh

      - name: Commit
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Everything is up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "sync formulae with their latest releases"
          git push
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
