name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      # Style, readall and audit over every formula in this tap. `readall`
      # loads each formula for every platform, so a formula must resolve to a
      # URL even on a platform its project ships no binary for.
      - run: brew test-bot --only-tap-syntax

      # These formulae install prebuilt release binaries, so there is nothing to
      # bottle. Install and test each one directly instead of `--only-formulae`.
      # The Linux job does not run from the checkout, so `Formula/*.rb` finds
      # nothing there. Ask Homebrew where it put the tap.
      - name: Install and test every formula
        run: |
          cd "$(brew --repository ryan953/tap)"
          for f in Formula/*.rb; do
            name="$(basename "$f" .rb)"
            brew install --formula "ryan953/tap/$name"
            brew test "ryan953/tap/$name"
          done

      # Every cask source is public, so the runner can fetch one. The apps are
      # ad-hoc signed rather than notarized, hence --no-quarantine; installing
      # never launches them, so this checks the download, the checksum and the
      # bundle layout.
      - name: Install every cask
        if: runner.os == 'macOS'
        run: |
          cd "$(brew --repository ryan953/tap)"
          for c in Casks/*.rb; do
            name="$(basename "$c" .rb)"
            brew install --cask --no-quarantine "ryan953/tap/$name"
            brew uninstall --cask "ryan953/tap/$name"
          done
