name: Test formulae

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install and test every formula
        run: |
          set -euo pipefail
          for f in Formula/*.rb; do
            name=$(basename "$f" .rb)
            echo "::group::$name"
            brew install --formula --verbose "$f"
            brew test --formula "$f"
            brew audit --strict --formula "$f"
            echo "::endgroup::"
          done
